$schema: https://json-schema.org/draft/2020-12/schema
title: Behavior
description: Intended behavior cases and outcomes, with optional debugging and test pointers; no execution order or completeness is implied.
type: object
additionalProperties: false
required:
  - id
  - name
  - description
  - trigger
  - cases
properties:
  id:
    type: string
    minLength: 1
    description: A stable identifier for this behavior within the application.
  name:
    type: string
    minLength: 1
    description: A human-readable name for the intended behavior.
  description:
    type: string
    minLength: 1
    description: The goal this behavior supports.
  trigger:
    type: string
    minLength: 1
    description: The user or system event relevant to this behavior.
  cases:
    type: array
    minItems: 1
    description: Distinct conditions and expected outcomes; the cases do not prescribe an execution sequence.
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - when
        - outcomes
      properties:
        id:
          type: string
          minLength: 1
          description: A stable identifier for this case within its behavior.
        name:
          type: string
          minLength: 1
          description: A human-readable name for this case.
        when:
          type: string
          minLength: 1
          description: The condition under which this case applies, in plain language.
        outcomes:
          type: array
          minItems: 1
          description: Observable results expected for this case.
          items:
            type: string
            minLength: 1
        implementedBy:
          type: array
          minItems: 1
          description: Curated function IDs useful for investigating this case; not an exhaustive call trace or an ordered sequence.
          items:
            type: object
            additionalProperties: false
            required:
              - function
              - role
            properties:
              function:
                type: string
                minLength: 1
                description: The ID of an entry in the application's function catalog.
              role:
                type: string
                minLength: 1
                description: Why this function is relevant to the case.
        verifiedBy:
          type: array
          minItems: 1
          description: Tests intended to check this case; passing status belongs to test runs, not this link.
          items:
            type: object
            additionalProperties: false
            required:
              - test
              - checks
            properties:
              test:
                type: string
                minLength: 1
                description: The ID of an entry in the application's test catalog.
              checks:
                type: string
                minLength: 1
                description: What this test checks for this case.
