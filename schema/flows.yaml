$schema: https://json-schema.org/draft/2020-12/schema
title: Flow
description: An intended path from a trigger to observable outcomes, with optional links to the current implementation.
type: object
additionalProperties: false
required:
  - id
  - name
  - description
  - trigger
  - paths
properties:
  id:
    type: string
    minLength: 1
    description: A stable identifier for this flow within the application.
  name:
    type: string
    minLength: 1
    description: A human-readable name for the intended behavior.
  description:
    type: string
    minLength: 1
    description: The goal this flow supports.
  trigger:
    type: string
    minLength: 1
    description: The user or system event that starts the flow.
  paths:
    type: array
    minItems: 1
    description: The meaningful alternatives from the trigger to an outcome.
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - when
        - steps
        - outcomes
      properties:
        id:
          type: string
          minLength: 1
          description: A stable identifier for this path within its flow.
        name:
          type: string
          minLength: 1
          description: A human-readable name for this path.
        when:
          type: string
          minLength: 1
          description: The condition under which this path applies, in plain language.
        steps:
          type: array
          minItems: 1
          description: Ordered, meaningful actions or observable checkpoints; not function calls.
          items:
            type: string
            minLength: 1
        outcomes:
          type: array
          minItems: 1
          description: Observable results expected when this path finishes.
          items:
            type: string
            minLength: 1
        implementedBy:
          type: array
          minItems: 1
          description: Current implementation pointers for this path; these do not define its intended behavior.
          items:
            type: object
            additionalProperties: false
            required:
              - function
              - role
            properties:
              function:
                type: string
                minLength: 1
                description: The ID of an entry in the application's function catalog.
              role:
                type: string
                minLength: 1
                description: Why this function is relevant to the path.
        verifiedBy:
          type: array
          minItems: 1
          description: Tests intended to check this path; passing status belongs to test runs, not this link.
          items:
            type: object
            additionalProperties: false
            required:
              - test
              - checks
            properties:
              test:
                type: string
                minLength: 1
                description: The ID of an entry in the application's test catalog.
              checks:
                type: string
                minLength: 1
                description: What this test checks for this path.
