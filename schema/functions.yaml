$schema: https://json-schema.org/draft/2020-12/schema
title: Function
type: object
additionalProperties: false
required:
  - id
  - name
  - parameters
  - return
properties:
  id:
    type: string
    minLength: 1
    description: Unique application identifier, independent of source position; preserve across moves or renames only after confirming the responsibility is unchanged
  name:
    type:
      - string
      - 'null'
    description: The declared name, or null for an anonymous function or callback
  description:
    type: string
    description: One or two sentences describing what the function does
  location:
    type: string
    minLength: 1
    description: Path to the owning source file, relative to the application root; no line or character offset
  context:
    type: string
    minLength: 1
    description: Optional searchable enclosing symbol or call-site hint, especially for anonymous functions; not an execution trace
  parameters:
    type: array
    description: The parameters of the function, in order
    items:
      type: object
      required:
        - name
        - type
        - required
      properties:
        name:
          type: string
          description: The name of the parameter
        type:
          type: string
          description: The type of the parameter
        description:
          type: string
          description: The description of the parameter
        default:
          type: string
          description: The default value of the parameter
        required:
          type: boolean
          description: Whether the parameter is required when calling the function
  return:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        description: Concise TypeScript-facing call return type; preserve promises, arrays, unions, nullability and useful named types, but summarize anonymous structural objects as object instead of storing expanded compiler output
      description:
        type: string
        description: The description of the return value
