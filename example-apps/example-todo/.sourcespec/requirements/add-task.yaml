# Parallel format experiment; the existing behaviors/add-task.yaml remains unchanged.
# implementedBy locates code; verifiedBy names intended checks, not passing test runs.
id: add-task
name: Add task
requirement: A signed-in person SHALL be able to create an incomplete task from non-blank text. Blank input SHALL not create a task, and a failed save SHALL not appear to succeed.
scenarios:
  - id: task-added
    name: Task added
    given:
      - A person is signed in and has entered text containing a non-whitespace character.
    when:
      - The person submits the new task and saving succeeds.
    then:
      - A new, incomplete task appears in the list with surrounding whitespace removed from its text.
      - The remaining count increases by one and the New task field is cleared.
      - The task remains available after a reload or local server restart.
    implementedBy:
      - function: add-task-submission
        role: Displays the saved task and clears the input only after a successful request.
      - function: todo-interface
        role: Loads saved tasks and renders the task list and remaining count.
      - function: client-create-task
        role: Sends the task to the local API.
      - function: local-api-handler
        role: Requires the current session and validates and routes the create request.
      - function: store-create-task
        role: Inserts the task into SQLite for the signed-in user.
    verifiedBy:
      - test: add-task-trims-input
        checks: The UI submits trimmed text and displays the new task, count, and cleared input.
      - test: api-validates-and-persists-tasks
        checks: The API stores trimmed task text for the signed-in account.
      - test: sqlite-tasks-survive-reopen
        checks: Task contents remain saved for the owner after reopening the database.

  - id: blank-task
    name: Blank task
    given:
      - A person is signed in.
    when:
      - The New task field is empty or contains only whitespace.
    then:
      - Add task is disabled; no task is added, and the list and remaining count stay unchanged.
    implementedBy:
      - function: todo-interface
        role: Disables Add task when the trimmed draft is empty.
    verifiedBy:
      - test: add-task-blocks-blank-input
        checks: Empty and whitespace-only input disable Add task and leave the list and count unchanged.

  - id: save-failed
    name: Save failed
    given:
      - A person is signed in and has entered non-blank task text.
    when:
      - The person submits the task but the save request fails.
    then:
      - An error is shown and the draft remains available to retry.
      - No unsaved task appears in the list.
    implementedBy:
      - function: add-task-submission
        role: Reports the failure and leaves the draft and task list unchanged.
      - function: client-create-task
        role: Sends the save request that may fail.
    verifiedBy:
      - test: add-task-save-failure
        checks: A failed save reports an error without clearing the draft or adding a task.
