# implementedBy locates code; verifiedBy names intended checks, not passing test runs.
id: change-task-completion
name: Change task completion
requirement: A signed-in person SHALL be able to mark their own task complete or reopen it, with the saved completion state and remaining count reflecting the change.
scenarios:
  - id: task-completed
    name: Mark complete
    given:
      - A signed-in person's task is incomplete.
    when:
      - The person checks the task and the update succeeds.
    then:
      - The task is checked and remains complete after reload.
      - The remaining count decreases by one.
    implementedBy:
      - function: fn:src/App.tsx#App.toggleTodo
        role: Updates the checkbox and count after the server confirms the change.
      - function: fn:server/todo-api.ts#createTodoHandler.return.handleTodoRequest
        role: Requires the current session and routes the update.
      - function: fn:server/todo-store.ts#openTodoStore.setTodoCompleted
        role: Updates only the current user's task in SQLite.
    verifiedBy:
      - test: test:src/App.test.tsx#marks-a-task-complete-and-updates-the-remaining-count
        checks: Completion checks the task and decreases the remaining count.
      - test: test:server/todo-api.test.ts#requires-a-session-and-keeps-HTTP-tasks-private-to-their-owner
        checks: The API persists completion and refuses updates to another user's task.
      - test: test:server/todo-api.test.ts#scopes-tasks-to-users-and-persists-them-across-SQLite-connections
        checks: The task stays complete after reopening SQLite.

  - id: task-reopened
    name: Reopen task
    given:
      - A signed-in person's task is complete.
    when:
      - The person unchecks the task and the update succeeds.
    then:
      - The task is unchecked and remains incomplete after reload.
      - The remaining count increases by one.
    implementedBy:
      - function: fn:src/App.tsx#App.toggleTodo
        role: Sends the new state and refreshes the checkbox and count.
      - function: fn:server/todo-store.ts#openTodoStore.setTodoCompleted
        role: Persists the new completion state for the current user.
    verifiedBy:
      - test: test:src/App.test.tsx#reopens-a-completed-task-and-restores-the-remaining-count
        checks: Reopening unchecks the task and increases the remaining count.
      - test: test:server/todo-api.test.ts#requires-a-session-and-keeps-HTTP-tasks-private-to-their-owner
        checks: The update endpoint persists the reopened state.
